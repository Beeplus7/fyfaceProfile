# MyFace Profile — /etc/nginx/sites-available/myfaceprofile
# Humans get the Vite SPA. Meta AI / crawlers get no-JS HTML at /.

map $http_user_agent $myface_static_bot {
    default 0;
    "" 1;
    # Meta AI / Facebook family (training + user-initiated fetch + previews + search indexer)
    ~*(?i)(meta-externalagent|meta-externalfetcher|meta-webindexer|meta-externalads|FacebookExternalHit|FacebookBot|Facebot|Instagram|WhatsApp) 1;
    ~*(?i)(GPTBot|ChatGPT|OAI-SearchBot|ClaudeBot|anthropic|Claude-Web|Claude-User|Claude-SearchBot|Google-Extended|Googlebot|GoogleOther|Google-CloudVertexBot|bingbot|BingPreview|Bytespider|CCBot|Diffbot|Twitterbot|Slackbot|LinkedInBot|LinkedInApp|Discordbot|Applebot|Applebot-Extended|Perplexity|Perplexity-User|Amazonbot|DuckAssist|cohere-ai|YouBot|Neeva|Phind|iAsk|AndiBot|omgili|SemrushBot|AhrefsBot|DotBot|PetalBot|Yandex|Baiduspider|DuckDuckBot|ia_archiver|archive\.org|MistralAI-User) 1;
    ~*(?i)(curl|wget|python-requests|python-urllib|httpx|aiohttp|Go-http-client|Java/|okhttp|axios|node-fetch|undici|libwww|Scrapy|Mechanize|HeadlessChrome|PhantomJS|Selenium|Playwright|puppeteer) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name myfaceprofile.aikova.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://myfaceprofile.aikova.co.uk$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myfaceprofile.aikova.co.uk;

    ssl_certificate /etc/letsencrypt/live/myfaceprofile.aikova.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myfaceprofile.aikova.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/myfaceprofile;
    index index.html;

    add_header X-Robots-Tag "index, follow, max-image-preview:large" always;
    add_header Link "</llms.txt>; rel=\"describedby\"; type=\"text/plain\", </myface-ai-readable.html>; rel=\"alternate\"; type=\"text/html\"" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/live-frame {
        client_max_body_size 2m;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-frame.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }
    location = /api/live-frame.php {
        client_max_body_size 2m;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-frame.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    location = /api/live-status {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-status.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }
    location = /api/live-status.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-status.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    location = /api/live-audio {
        client_max_body_size 2m;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-audio.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }
    location = /api/live-audio.php {
        client_max_body_size 2m;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-audio.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    location = /api/live-guests {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-guests.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }
    location = /api/live-guests.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-guests.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    location = /api/live-chat {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-chat.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }
    location = /api/live-chat.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/myfaceprofile/api/live-chat.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    # Explicit machine / AI surfaces (must win over SPA catch-all)
    location = /llms.txt {
        try_files /llms.txt =404;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-MyFace-Site "myfaceprofile" always;
    }
    location = /.well-known/llms.txt {
        try_files /llms.txt =404;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-MyFace-Site "myfaceprofile" always;
    }
    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-MyFace-Site "myfaceprofile" always;
    }
    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-MyFace-Site "myfaceprofile" always;
    }
    location = /myface-ai-readable.html {
        try_files /myface-ai-readable.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-MyFace-Site "myfaceprofile" always;
    }
    location = /myface-og.jpg {
        try_files /myface-og.jpg =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-MyFace-Site "myfaceprofile" always;
    }

    # Home: bots → static readable HTML; humans → SPA shell
    location = / {
        if ($myface_static_bot = 1) {
            rewrite ^ /myface-ai-readable.html last;
        }
        try_files /index.html =404;
        add_header X-MyFace-Site "myfaceprofile" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-MyFace-Site "myfaceprofile" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    }
}
